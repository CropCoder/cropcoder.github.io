<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found - Jiwen Zhao</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/images/favicon.ico">
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        background: #f7f8fa;
        color: #1d2129;
      }
      .card {
        max-width: 460px;
        margin: 24px;
        padding: 48px 40px;
        text-align: center;
        background: #fff;
        border: 1px solid #e5e6eb;
        border-radius: 12px;
      }
      .code {
        font-size: 56px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #006d72;
        margin: 0 0 8px;
      }
      h1 { font-size: 20px; margin: 0 0 10px; }
      p { color: #4e5969; margin: 0 0 28px; }
      a.btn {
        display: inline-block;
        padding: 10px 26px;
        border-radius: 8px;
        background: #006d72;
        color: #fff;
        text-decoration: none;
        font-weight: 700;
      }
      a.alt { color: #006d72; margin-left: 14px; }
      @media (prefers-color-scheme: dark) {
        body { background: #17181c; color: #e8eaed; }
        .card { background: #1f2024; border-color: #2f3138; }
        p { color: #b6bac2; }
        .code, a.alt { color: #6ea8fe; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p>The page you are looking for does not exist or has moved.</p>
      <a class="btn" href="/">Back to Home</a>
      <a class="alt" href="/blog/index.html">Browse Blog</a>
    </main>
  </body>
</html>
