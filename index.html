<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jiwen Zhao — Bioinformatics &amp; Crop Disease Resistance</title>
    <meta name="description" content="Jiwen Zhao — Ph.D. candidate in Genetics, CAS. Research in wheat genomics, pan-genomes, GWAS, and crop disease resistance.">
    <meta name="author" content="Jiwen Zhao">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Jiwen Zhao — Bioinformatics &amp; Crop Disease Resistance">
    <link rel="icon" href="images/favicon.ico">
    <style>
      :root {
        --bg: #f6faf9;
        --bg-2: #eef4f3;
        --surface: #ffffff;
        --ink: #0a1f2e;
        --blue: #0a6cff;
        --blue-bright: #4da3ff;
        --amber: #c8923a;
        --muted: #5a7184;
        --hair: rgba(10, 31, 46, 0.10);
        --max: 1080px;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(120% 100% at 50% -10%, #ffffff 0%, var(--bg) 55%, var(--bg-2) 100%);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        font-size: 16px;
        line-height: 1.6;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }

      a { color: inherit; text-decoration: none; }

      #field {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }

      .veil {
        position: fixed;
        inset: 0;
        z-index: 40;
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.8s ease 0.15s;
      }
      .veil.is-done { opacity: 0; pointer-events: none; }
      .veil__mark {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1rem;
        letter-spacing: 0.34em;
        color: var(--blue);
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse { 0%,100% { opacity: 0.3; } 50% { opacity: 0.85; } }

      .topbar {
        position: fixed;
        top: 0; left: 0; right: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: min(100% - 48px, var(--max));
        margin: 0 auto;
        padding: 22px 0;
      }
      .topbar__brand {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.02rem;
        letter-spacing: 0.02em;
      }
      .topbar__brand span { color: var(--blue); }
      .topbar__nav {
        display: flex;
        gap: 28px;
        font-family: ui-monospace, "SFMono-Regular", Consolas, Menlo, monospace;
        font-size: 0.74rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .topbar__nav a { transition: color 0.2s ease; }
      .topbar__nav a:hover { color: var(--blue); }

      .stage {
        position: relative;
        z-index: 10;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        width: min(100% - 48px, var(--max));
        margin: 0 auto;
        padding: 120px 0;
      }

      .reveal {
        opacity: 0;
        transform: translateY(16px);
        transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.2, 0.7, 0.2, 1);
      }
      .reveal.is-in { opacity: 1; transform: none; }

      .kicker {
        font-family: ui-monospace, "SFMono-Regular", Consolas, Menlo, monospace;
        font-size: 0.72rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--blue);
        margin: 0 0 24px;
        display: inline-flex;
        align-items: center;
        gap: 12px;
      }
      .kicker::before,
      .kicker::after {
        content: "";
        width: 26px; height: 1px;
        background: var(--blue);
      }

      .display {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        font-weight: 700;
        font-size: clamp(2.8rem, 7.5vw, 5.2rem);
        line-height: 1.02;
        letter-spacing: -0.01em;
        margin: 0 0 10px;
      }
      .display .accent { color: var(--amber); font-style: italic; }

      .subtitle {
        font-size: 1.1rem;
        line-height: 1.7;
        color: var(--muted);
        max-width: 52ch;
        margin: 0 auto 20px;
      }
      .subtitle b { color: var(--ink); font-weight: 600; }

      .role {
        font-family: ui-monospace, "SFMono-Regular", Consolas, Menlo, monospace;
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin: 0 0 36px;
      }

      /* 3D 悬浮交互式多功能卡片 */
      .cards {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: stretch;
        gap: 20px;
        margin-top: 8px;
        perspective: 1200px;
      }

      .card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
        width: 218px;
        padding: 26px 24px 22px;
        border-radius: 18px;
        color: var(--ink);
        text-align: left;
        background-color: rgba(255, 255, 255, 0.72);
        background-image:
          radial-gradient(circle at 18% 0%, rgba(77, 163, 255, 0.16), transparent 55%),
          linear-gradient(rgba(10, 108, 255, 0.10) 1px, transparent 1px),
          linear-gradient(90deg, rgba(10, 108, 255, 0.10) 1px, transparent 1px),
          linear-gradient(160deg, rgba(255, 255, 255, 0.92), rgba(214, 232, 255, 0.82));
        background-size: 100% 100%, 26px 26px, 26px 26px, 100% 100%;
        animation: card-grid-flow 5s linear infinite;
        border: 1px solid rgba(10, 108, 255, 0.14);
        box-shadow: 0 12px 26px rgba(10, 31, 46, 0.10);
        transform-style: preserve-3d;
        will-change: transform;
        transition: transform 0.12s ease-out, box-shadow 0.35s ease, border-color 0.35s ease;
      }
      .card:hover {
        border-color: rgba(10, 108, 255, 0.45);
        box-shadow: 0 26px 54px rgba(10, 108, 255, 0.24);
      }

      /* 网格流动动画：网格线沿对角线循环平移 */
      @keyframes card-grid-flow {
        from { background-position: 0 0, 0 0, 0 0, 0 0; }
        to   { background-position: 0 0, 26px 26px, 26px 26px, 0 0; }
      }

      .card__icon {
        width: 46px; height: 46px;
        display: grid; place-items: center;
        border-radius: 12px;
        color: #fff;
        background: linear-gradient(135deg, var(--blue-bright), var(--blue));
        box-shadow: 0 8px 18px rgba(10, 108, 255, 0.32);
        transform: translateZ(40px);
      }
      .card__icon svg {
        width: 22px; height: 22px;
        fill: none; stroke: currentColor;
        stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
      }

      /* 文字图标（中文「中」/ 英文「EN」） */
      .card__icon--glyph {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
        font-weight: 700;
        font-size: 1.05rem;
        letter-spacing: 0.02em;
      }

      .card__title {
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: 0.01em;
        text-align: center;
        transform: translateZ(34px);
      }
      .card__arrow {
        margin-top: auto;
        align-self: flex-end;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--blue);
        transform: translateZ(28px);
      }
      .card__arrow svg {
        width: 14px; height: 14px;
        fill: currentColor;
        transition: transform 0.25s ease;
      }
      .card:hover .card__arrow svg { transform: translateX(4px); }

      /* 单入口语言卡片：内容居中 */
      .card--lang {
        align-items: center;
        text-align: center;
      }
      .card--lang .card__arrow { align-self: center; }

      /* 光斑跟随鼠标 */
      .card__glare {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        background: radial-gradient(circle at var(--gx, 50%) var(--gy, 50%), rgba(255, 255, 255, 0.5), transparent 45%);
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      .card:hover .card__glare { opacity: 1; }

      @media (max-width: 760px) {
        .topbar__nav { display: none; }
        .stage { padding: 100px 0; }
        .cards { gap: 14px; }
        .card { width: 100%; max-width: 340px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .reveal { opacity: 1; transform: none; transition: none; }
        .veil__mark { animation: none; }
        .card { animation: none; }
      }
    </style>
  </head>
  <body>
    <canvas id="field" aria-hidden="true"></canvas>

    <div class="veil" id="veil">
      <div class="veil__mark">J · Z</div>
    </div>

    <header class="topbar">
      <a class="topbar__brand" href="index.html">Jiwen Zhao <span>·</span> CropCoder</a>
      <nav class="topbar__nav" aria-label="Primary">
        <a href="en.html#research">Research</a>
        <a href="en.html#publications">Publications</a>
        <a href="en.html#resources">Blog</a>
      </nav>
    </header>

    <main class="stage">
      <p class="kicker reveal">Bioinformatics &middot; Crop Disease Resistance</p>

      <h1 class="display reveal">Jiwen Zhao<span class="accent">.</span></h1>

      <p class="subtitle reveal">
        <b>Ph.D. candidate in Genetics</b>
      </p>

      <p class="role reveal">Chinese Academy of Sciences</p>

      <div class="cards reveal">
        <a class="card card--lang" href="cn.html">
          <span class="card__icon card__icon--glyph">中</span>
          <span class="card__title">进入网站</span>
          <span class="card__arrow">中文 <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h12.2l-4.6-4.6L14 6l7 6-7 6-1.4-1.4 4.6-4.6H5Z"/></svg></span>
          <span class="card__glare"></span>
        </a>

        <a class="card card--lang" href="en.html">
          <span class="card__icon card__icon--glyph">EN</span>
          <span class="card__title">Enter Site</span>
          <span class="card__arrow">English <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h12.2l-4.6-4.6L14 6l7 6-7 6-1.4-1.4 4.6-4.6H5Z"/></svg></span>
          <span class="card__glare"></span>
        </a>
      </div>
    </main>

    <script>
      (function () {
        var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var canvas = document.getElementById('field');
        var ctx = canvas.getContext('2d');
        var W, H, dpr = Math.min(window.devicePixelRatio || 1, 2);

        function resize() {
          W = window.innerWidth;
          H = window.innerHeight;
          canvas.width = W * dpr;
          canvas.height = H * dpr;
          canvas.style.width = W + 'px';
          canvas.style.height = H + 'px';
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        resize();
        window.addEventListener('resize', resize);

        // particle count scales with viewport, capped
        var COUNT = Math.min(90, Math.floor((W * H) / 16000));
        var particles = [];
        for (var i = 0; i < COUNT; i++) {
          particles.push({
            x: Math.random() * W,
            y: Math.random() * H,
            vx: (Math.random() - 0.5) * 0.9,
            vy: (Math.random() - 0.5) * 0.9,
            phase: Math.random() * Math.PI * 2,
            tw: Math.random() * Math.PI * 2,
            r: 1.2 + Math.random() * 1.8
          });
        }

        var mouse = { x: W / 2, y: H / 2, sx: W / 2, sy: H / 2, prevX: W / 2, prevY: H / 2, speed: 0, active: false };
        window.addEventListener('pointermove', function (e) {
          mouse.x = e.clientX;
          mouse.y = e.clientY;
          mouse.active = true;
        });
        window.addEventListener('pointerleave', function () { mouse.active = false; });

        var LINK_DIST = 150;
        var MOUSE_DIST = 220;
        var haloT = 0;

        function draw() {
          ctx.clearRect(0, 0, W, H);

          // smooth-follow halo position + speed-based pulse
          haloT += 0.03;
          mouse.sx += (mouse.x - mouse.sx) * 0.12;
          mouse.sy += (mouse.y - mouse.sy) * 0.12;
          var dxs = mouse.x - mouse.prevX, dys = mouse.y - mouse.prevY;
          var inst = Math.sqrt(dxs * dxs + dys * dys);
          mouse.speed += (inst - mouse.speed) * 0.15;
          mouse.prevX = mouse.x; mouse.prevY = mouse.y;
          var breath = Math.sin(haloT) * 16;
          var speedBoost = Math.min(mouse.speed * 3.0, 120);
          var haloR = 320 + breath + speedBoost;
          var coreR = 58 + breath * 0.4 + speedBoost * 0.3;

          // outer cool halo (broad, soft) —— 科技蓝外层光晕
          var g0 = ctx.createRadialGradient(mouse.sx, mouse.sy, 0, mouse.sx, mouse.sy, haloR * 2.6);
          g0.addColorStop(0, 'rgba(255, 255, 255, 0.55)');
          g0.addColorStop(0.35, 'rgba(235, 244, 255, 0.25)');
          g0.addColorStop(1, 'rgba(235, 244, 255, 0)');
          ctx.fillStyle = g0;
          ctx.fillRect(0, 0, W, H);

          // mid blue halo —— 科技蓝中层光晕
          var g1 = ctx.createRadialGradient(mouse.sx, mouse.sy, 0, mouse.sx, mouse.sy, haloR);
          g1.addColorStop(0, 'rgba(77, 163, 255, 0.22)');
          g1.addColorStop(0.5, 'rgba(77, 163, 255, 0.07)');
          g1.addColorStop(1, 'rgba(77, 163, 255, 0)');
          ctx.fillStyle = g1;
          ctx.fillRect(0, 0, W, H);

          // bright amber core —— 保留暖色强调
          var g2 = ctx.createRadialGradient(mouse.sx, mouse.sy, 0, mouse.sx, mouse.sy, coreR);
          g2.addColorStop(0, 'rgba(244, 205, 138, 0.5)');
          g2.addColorStop(0.6, 'rgba(200, 146, 58, 0.12)');
          g2.addColorStop(1, 'rgba(200, 146, 58, 0)');
          ctx.fillStyle = g2;
          ctx.fillRect(0, 0, W, H);

          // crisp center point —— 科技蓝
          ctx.fillStyle = 'rgba(10, 108, 255, 0.9)';
          ctx.beginPath();
          ctx.arc(mouse.sx, mouse.sy, 2.4, 0, Math.PI * 2);
          ctx.fill();

          // update + draw particles —— 水波漂移 + 星星闪烁
          for (var i = 0; i < particles.length; i++) {
            var p = particles[i];

            // 水波式流动：基础速度 + 正弦波漂移
            p.x += p.vx + Math.sin(haloT * 1.4 + p.phase) * 0.5;
            p.y += p.vy + Math.cos(haloT * 1.4 + p.phase) * 0.5;

            // 星星闪烁：半径与亮度随相位呼吸
            var twinkle = 0.55 + 0.45 * Math.sin(haloT * 2.2 + p.tw);

            // gentle cursor attraction
            if (mouse.active) {
              var dxm = mouse.sx - p.x;
              var dym = mouse.sy - p.y;
              var dm = Math.sqrt(dxm * dxm + dym * dym);
              if (dm < MOUSE_DIST && dm > 0.1) {
                var pull = (1 - dm / MOUSE_DIST) * 0.25;
                p.vx += (dxm / dm) * pull * 0.04;
                p.vy += (dym / dm) * pull * 0.04;
              }
            }

            // soft damping + bounds wrap
            p.vx *= 0.992; p.vy *= 0.992;
            if (p.x < -20) p.x = W + 20; else if (p.x > W + 20) p.x = -20;
            if (p.y < -20) p.y = H + 20; else if (p.y > H + 20) p.y = -20;

            // node glow —— 科技蓝，随闪烁呼吸
            var gr = p.r * (4 + twinkle * 1.5);
            var ng = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, gr);
            ng.addColorStop(0, 'rgba(77, 163, 255, ' + (0.55 * twinkle).toFixed(2) + ')');
            ng.addColorStop(1, 'rgba(77, 163, 255, 0)');
            ctx.fillStyle = ng;
            ctx.beginPath();
            ctx.arc(p.x, p.y, gr, 0, Math.PI * 2);
            ctx.fill();

            // node core —— 科技蓝
            ctx.fillStyle = 'rgba(10, 108, 255, 0.9)';
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r * (0.75 + 0.35 * twinkle), 0, Math.PI * 2);
            ctx.fill();
          }

          // connecting lines (constellation)
          for (var a = 0; a < particles.length; a++) {
            for (var b = a + 1; b < particles.length; b++) {
              var p1 = particles[a], p2 = particles[b];
              var dx = p1.x - p2.x, dy = p1.y - p2.y;
              var d = Math.sqrt(dx * dx + dy * dy);
              if (d < LINK_DIST) {
                var alpha = (1 - d / LINK_DIST) * 0.35;
                ctx.strokeStyle = 'rgba(10, 108, 255, ' + alpha + ')';
                ctx.lineWidth = 0.8;
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
              }
            }
          }

          // lines from cursor to nearby particles
          if (mouse.active) {
            for (var c = 0; c < particles.length; c++) {
              var pc = particles[c];
              var dxc = pc.x - mouse.sx, dyc = pc.y - mouse.sy;
              var dc = Math.sqrt(dxc * dxc + dyc * dyc);
              if (dc < MOUSE_DIST) {
                var am = (1 - dc / MOUSE_DIST) * 0.5;
                ctx.strokeStyle = 'rgba(200, 146, 58, ' + am + ')';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(mouse.sx, mouse.sy);
                ctx.lineTo(pc.x, pc.y);
                ctx.stroke();
              }
            }
          }

          requestAnimationFrame(draw);
        }

        if (reduced) {
          // static single frame
          draw = (function (orig) {
            return function () { orig.call(this); };
          })(draw);
          draw();
        } else {
          draw();
        }

        // reveal on load
        var reveals = document.querySelectorAll('.reveal');
        var veil = document.getElementById('veil');
        function revealIn() {
          veil.classList.add('is-done');
          reveals.forEach(function (el, i) {
            setTimeout(function () { el.classList.add('is-in'); }, 100 + i * 150);
          });
        }
        if (document.readyState === 'complete') {
          setTimeout(revealIn, 350);
        } else {
          window.addEventListener('load', function () { setTimeout(revealIn, 350); });
        }
        // safety fallback
        setTimeout(revealIn, 1600);

        // 3D 卡片鼠标交互：透视倾斜 + 光斑跟随
        if (!reduced) {
          var cards = document.querySelectorAll('.card');
          cards.forEach(function (card) {
            var glare = card.querySelector('.card__glare');
            card.addEventListener('pointermove', function (e) {
              var rect = card.getBoundingClientRect();
              var px = (e.clientX - rect.left) / rect.width;
              var py = (e.clientY - rect.top) / rect.height;
              var rx = (0.5 - py) * 14;
              var ry = (px - 0.5) * 14;
              card.style.transform = 'translateY(-8px) rotateX(' + rx.toFixed(2) + 'deg) rotateY(' + ry.toFixed(2) + 'deg)';
              if (glare) {
                glare.style.setProperty('--gx', (px * 100).toFixed(1) + '%');
                glare.style.setProperty('--gy', (py * 100).toFixed(1) + '%');
              }
            });
            card.addEventListener('pointerleave', function () {
              card.style.transform = '';
            });
          });
        }
      })();
    </script>
  </body>
</html>
